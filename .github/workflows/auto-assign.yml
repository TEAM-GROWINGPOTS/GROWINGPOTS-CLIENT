name: Auto Assign

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - name: Assign author to issue/PR
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request
              ? context.payload.pull_request.user.login
              : context.payload.issue.user.login;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [author]
            });

  assign-fair-reviewer:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewer config
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Assign fair reviewer
        uses: actions/github-script@v7
        with:
          script: |
            const { default: assignReviewers } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/assign-reviewer.mjs`
            );
            await assignReviewers({ github, context, core });
